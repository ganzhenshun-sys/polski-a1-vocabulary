<style>
:root{--ink:#20211f;--muted:#77766f;--paper:#f6f3ee;--card:#fffefa;--line:#e9e4da;--green:#376d59;--green2:#e2eee7;--orange:#cb7652;--shadow:0 10px 30px #3025160c}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:calc(88px + env(safe-area-inset-bottom))}button,input{font:inherit}button{cursor:pointer;color:inherit}.wrap{max-width:780px;margin:auto;padding:0 20px}.top{padding:18px 0 9px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;letter-spacing:-.04em;font-size:20px}.brand span{color:var(--green)}.streak{background:#fff;border:1px solid var(--line);padding:8px 12px;border-radius:99px;font-size:13px}.hero{padding:22px 0 18px}.eyebrow{font-size:11px;color:var(--green);letter-spacing:.13em;font-weight:800;text-transform:uppercase}.hero h1{font-size:31px;line-height:1.1;letter-spacing:-.04em;margin:8px 0}.hero p{color:var(--muted);margin:8px 0 0}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:17px;margin:10px 0 18px;box-shadow:var(--shadow)}.rowtop{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}.bar{height:8px;background:#eee9df;border-radius:8px;margin-top:10px;overflow:hidden}.bar b{display:block;background:var(--green);height:100%;border-radius:8px}.title{display:flex;justify-content:space-between;align-items:end;margin:22px 0 10px}.title h2{font-size:18px;margin:0}.title small{color:var(--muted)}.days{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.day{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:11px 7px;text-align:center;font-size:11px;color:var(--muted)}.day b{display:block;color:var(--ink);font-size:12px;margin-bottom:3px}.day.active{border-color:var(--green);background:var(--green2)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:13px 0}.action{border:0;border-radius:16px;padding:1
